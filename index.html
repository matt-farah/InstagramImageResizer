<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Page</title>

    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.5.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.5.2/core.js"></script>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #C6C5B9;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #0047AB;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 2rem;
            background-color: #62929E;
            color: white;
            border-radius: 8px;
            max-width: 400px;
            margin: 2rem auto;
        }

        label {
            display: block;
            margin-top: 1rem;
        }

        input[type="submit"] {
            margin-top: 1rem;
            background-color: #0047AB;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #003a8c;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="faq.html">FAQ</a>
    </nav>

    <!-- Main Content -->
    <div class="container">
        <form action="" onsubmit="return false;">
            <label><input type="radio" name="size_select" value="vertical" checked> Vertical 1080x1350</label>
            <label><input type="radio" name="size_select" value="square"> Square 1080x1080</label>
            <label><input type="radio" name="size_select" value="landscape"> Landscape 1080x566</label>
            <label><input type="radio" name="size_select" value="story"> Landscape 1080x1920</label>
            <hr style = "background-color:invisible; height:1px">
            <label for="borderWidth">Border Width in pixels:</label>
            <input type="number" id="borderWidth" name="borderWidth" min="0" max="500" value="0">

            <label for="backColor">Select a Background Color:</label>
            <input type="color" id="backColor" name="backColor" value="#ffffff">

            <label for="file-upload-pillow">Upload an image or multiple images:</label>
            <input type="file" id="file-upload-pillow" multiple>

            <input type="submit" value="Submit">
        </form>

        <div id="output_upload_pillow"></div>
    </div>

    <!-- PyScript -->
    <py-config>
        packages = ["pillow"]
    </py-config>
    <script type="py" src="./webImpageProcess.py"></script>
</body>
</html>

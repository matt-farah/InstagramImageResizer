<!doctype html>
<html>
    <head>
        <!-- Recommended meta tags -->
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <!-- PyScript CSS -->
        <link rel="stylesheet" href="https://pyscript.net/releases/2024.5.2/core.css">
        <!-- This script tag bootstraps PyScript -->
        <script type="module" src="https://pyscript.net/releases/2024.5.2/core.js"></script>
    </head>
    <body>
        <py-config>
        packages = ["pillow"]
        </py-config>
        <form action="" onsubmit="return false;">
            <input type="radio" name="size_select" value="vertical" checked>
            <label for="vertical">Vertical 1080x1350</label><br>
            <input type="radio" name="size_select" value="square">
            <label for="vertical">Square 1080x1080</label><br>
            <input type="radio" name="size_select" value="landscape">
            <label for="vertical">Landscape 1080x566</label><br>
            <label for="Upload an image or multiple images"></label><input type="file" id="file-upload-pillow" multiple>
            <input type="submit" value="Submit">
        </form>
        <div id="output_upload_pillow"></div>
        <script type="py" src="./webImpageProcess.py"></script>

    </body>
</html>

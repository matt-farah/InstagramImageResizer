<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Photo Resizer</title>

    <!-- PyScript CSS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.5.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.5.2/core.js"></script>

    <!-- Custom Styles -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0EBD8;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #1C2321;
            padding: 1rem;
            display: flex;
            justify-content: center;
        }

        nav a {
            color: #F0EBD8;
            text-decoration: none;
            margin: 0 1rem;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        .container {
            padding: 2rem;
            background-color: #62929E;
            color: white;
            border-radius: 8px;
            max-width: 400px;
            margin: 2rem auto;
        }

        label {
            display: block;
            margin-top: 1rem;
        }

        input[type="submit"] {
            margin-top: 1rem;
            background-color: #782B6B;
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            cursor: pointer;
        }

        input[type="submit"]:hover {
            background-color: #003a8c;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="faq.html">FAQ</a>
    </nav>

    <!-- Install Locally Option --> 
    <button id="install-btn" style="display:none;">Install App</button>
    <p id="status"></p>

    <script>
        let deferredPrompt;

        window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('install-btn').style.display = 'block';

        document.getElementById('install-btn').addEventListener('click', async () => {
            deferredPrompt.prompt();
            const choiceResult = await deferredPrompt.userChoice;
            if (choiceResult.outcome === 'accepted') {
            console.log('User accepted install');
            }
            deferredPrompt = null;
        });
        });

        window.addEventListener('appinstalled', () => {
        console.log('App installed');
        if (window.triggerPyInstall) window.triggerPyInstall();
        });

        // Safari standalone mode detection
        if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        console.log('Running in standalone mode');
        window.addEventListener('load', () => {
            if (window.triggerPyInstall) window.triggerPyInstall();
        });
        }
    </script>


    <!-- Main Content -->
    <div class="container">
        <h2>Instagram Photo Resizer</h2>
        <h4>1. Select your target size:</h4>
        <form action="" onsubmit="return false;">
            <label><input type="radio" name="size_select" value="vertical" checked> Vertical 1080x1350</label>
            <label><input type="radio" name="size_select" value="square"> Square 1080x1080</label>
            <label><input type="radio" name="size_select" value="landscape"> Landscape 1080x566</label>
            <label><input type="radio" name="size_select" value="story"> Story 1080x1920</label>
        <h4>2. Select your Border Width and background color:</h4>
            <label for="borderWidth">Border Width in pixels:</label>
            <input type="number" id="borderWidth" name="borderWidth" min="0" max="500" value="0">

            <label for="backColor">Select a Background Color:</label>
            <input type="color" id="backColor" name="backColor" value="#ffffff">
        <h4>3. Pick your image(s):</h4>
            <label for="file-upload-pillow">Select an image or multiple images:</label>
            <input type="file" id="file-upload-pillow" multiple accept="image/png, image/jpeg">
        <h4>4. Click Submit!</h4>
            <input type="submit" value="Submit">
        </form>

        <div id="output_upload_pillow"></div>
    </div>

    <!-- PyScript -->
    <py-config>
        packages = ["pillow"]
    </py-config>
    <script type="py" src="./webImpageProcess.py"></script>
</body>
</html>
